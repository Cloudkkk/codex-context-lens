</style><h1>安装 Context Lens</h1><p>在 Codex 回复操作栏中悬停查看上下文用量。</p>
<p>安装器会为当前登录的 macOS 用户自动完成文件放置、来源登记和插件安装。安装后在插件详情运行 Setup 初始化，按需自动重启。</p>
<ul><li>请先安装 Codex 或集成 Codex 的 ChatGPT 桌面端。</li><li>优先使用 Codex 自带 Python；也支持本机 Python 3.9+。</li><li>已有同名来源会切换到安装器管理的本地目录。</li></ul>
<p>安装目录：个人 Library/Application Support/Codex Context Lens。安装器不会自动信任 hook。</p></html>
