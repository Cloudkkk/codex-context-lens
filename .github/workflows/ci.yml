name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Python regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: plugins/context-lens
        run: python -m unittest discover -s plugins/context-lens/tests -v
      - name: Installer regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: JavaScript matching tests
        run: node --test plugins/context-lens/tests/test*.cjs
      - name: Frontend syntax checks
        run: |
          node --check plugins/context-lens/web/matching.js
          node --check plugins/context-lens/web/overlay.js
          node --check plugins/context-lens/web/demo.js
      - name: Build and validate distribution archives
        run: python scripts/package.py --output-directory "$RUNNER_TEMP/context-lens-packages"
      - name: Build macOS GUI installer
        if: runner.os == 'macOS'
        run: python scripts/build_macos_package.py --output-directory "$RUNNER_TEMP/context-lens-packages"
